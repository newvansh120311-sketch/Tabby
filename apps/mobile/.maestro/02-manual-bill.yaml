appId: app.tabby.split
name: Type a bill in, share it, claim
---
- launchApp
- tapOn: "New bill"
- tapOn: "Type it in"
- tapOn:
    id: "bill-title"
- inputText: "Maestro chai"
- tapOn:
    id: "item-name-0"
- inputText: "Masala chai"
- tapOn:
    id: "item-price-0"
- inputText: "80"
- hideKeyboard
- tapOn: "Add an item"
- tapOn:
    id: "item-name-1"
- inputText: "Samosa"
- tapOn:
    id: "item-price-1"
- inputText: "50"
- hideKeyboard
- assertVisible: "₹130.00"
- tapOn:
    id: "save-bill"
- extendedWaitUntil:
    visible: "Send this to everyone"
    timeout: 20000
- assertVisible: "Share link"
- tapOn: "Show QR code"
- assertVisible: "Scan with a phone camera.*"
- tapOn: "Done"
- tapOn: "Masala chai, .*"
- assertVisible: "You"
