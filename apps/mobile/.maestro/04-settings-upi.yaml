appId: app.tabby.split
name: Settings validate the UPI ID and save
---
- launchApp
- tapOn: "Settings"
- tapOn:
    id: "settings-name"
- eraseText: 30
- inputText: "Maestro"
- tapOn:
    id: "settings-upi"
- eraseText: 40
- inputText: "not a upi id"
- assertVisible: "That doesn’t look like a UPI ID.*"
- eraseText: 20
- inputText: "tester@okaxis"
- assertNotVisible: "That doesn’t look like a UPI ID.*"
- hideKeyboard
- tapOn: "Save settings"
- assertVisible: "Saved"
